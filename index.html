<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="header">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix image" class="header__img">
      <a class="header__more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main-page_element main-page_element__centered">
      <section id="add-task" class="task-section task-section_add">
        <h3 class="task-section__header">Add Item</h3>
        <ul class="task-list">
          <li class="task-item task-item_add">
            <input id="new-task" class="task-item__name" type="text">
            <button class="task-item__button task-item__button_add">Add</button>
          </li>
        </ul>
      </section>
      <section class="task-section">
        <h3 class="task-section__header">Todo</h3>
        <ul id="incompleted-tasks" class="task-list">
          <li class="task-item">
            <input type="checkbox" class="task-item__checkbox">
            <label class="task-item__label">Pay Bills</label>
            <input type="text" class="task-item__name">
            <button class="task-item__button task-item__button_edit">Edit</button>
            <button class="task-item__button task-item__button_delete"><img src="./remove.svg" alt=""></button>
          </li>
          <li class="task-item task-item_edit-mode">
            <input type="checkbox" class="task-item__checkbox">
            <label class="task-item__label">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task-item__name">
            <button class="task-item__button task-item__button_edit">Save</button>
            <button class="task-item__button task-item__button_delete"><img src="./remove.svg" alt=""></button>
          </li>
        </ul>
      </section>
      <section class="task-section">
        <h3 class="task-section__header">Completed</h3>
        <ul id="completed-tasks" class="task-list task-list_completed">
          <li class="task-item">
            <input type="checkbox" class="task-item__checkbox" checked>
            <label class="task-item__label task-item__label">See the Doctor</label>
            <input type="text" class="task-item__name">
            <button class="task-item__button task-item__button_edit">Edit</button>
            <button class="task-item__button task-item__button_delete"><img src="./remove.svg" alt=""></button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
