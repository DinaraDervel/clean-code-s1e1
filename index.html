<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="header">
      <img src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix image" class="header__img">
      <a class="header__more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main-page_element main-page_element__centered">
      <section id="add-task">
        <label for="new-task">Add Item</label>
        <div class="task-wrapper">
          <input id="new-task"class="task-name" type="text">
          <button>Add</button>
        </div>
      </section>
      <section>
        <h3>Todo</h3>
        <ul id="incompleted-tasks">
          <li>
            <input type="checkbox">
            <label class="task-name">Pay Bills</label>
            <input type="text" class="task-name">
            <button class="edit-button">Edit</button>
            <button class="delete-button"><img src="./remove.svg" alt=""></button>
          </li>
          <li class="edit-mode">
            <input type="checkbox">
            <label class="task-name">Go Shopping</label>
            <input type="text" value="Go Shopping" class="task-name">
            <button class="edit-button">Save</button>
            <button class="delete-button"><img src="./remove.svg" alt=""></button>
          </li>
        </ul>
      </section>
      <section>
        <h3>Completed</h3>
        <ul id="completed-tasks">
          <li>
            <input type="checkbox" checked>
            <label class="task-name">See the Doctor</label>
            <input type="text" class="task-name">
            <button class="edit-button">Edit</button>
            <button class="delete-button"><img src="./remove.svg" alt=""></button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
